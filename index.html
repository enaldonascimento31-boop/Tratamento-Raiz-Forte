<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A redirecionar com segurança...</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0b0f19;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 380px;
      width: 100%;
    }
    .spinner-box {
      position: relative;
      width: 60px;
      height: 60px;
      margin-bottom: 24px;
    }
    .spinner {
      width: 100%;
      height: 100%;
      border: 4px solid #1f2937;
      border-top: 4px solid #10b981;
      border-radius: 50%;
      animation: spin 0.8s cubic-bezier(0.6, 0.2, 0.4, 0.8) infinite;
    }
    .spinner-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #10b981;
      font-size: 18px;
    }
    h2 {
      font-size: 18px;
      font-weight: 700;
      color: #f3f4f6;
      margin-bottom: 6px;
    }
    p {
      font-size: 13px;
      color: #9ca3af;
      margin-bottom: 20px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #111827;
      border: 1px solid #1f2937;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 11px;
      color: #10b981;
      font-weight: 600;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="spinner-box">
      <div class="spinner"></div>
      <i class="fa-solid fa-lock spinner-icon"></i>
    </div>
    <h2>A preparar o seu atendimento...</h2>
    <p>A conectar ao checkout oficial criptografado.</p>
    <div class="badge">
      <i class="fa-solid fa-shield-halved"></i> Ambiente 100% Seguro
    </div>
  </div>

  <script>
    // ================= CONFIGURAÇÕES DO SEU FUNIL =================
    const RAPUNZEL_URL = "http://SEU_IP_OU_DOMINIO:3000"; // Seu IP ou domínio da VPS
    const FUNNEL_ID = "1";
    const CHECKOUT_URL = "https://pay.wiapy.com/Gqwf8-zXEiMY";

    async function redirectNow() {
      // 1. Extrai dados passados na URL pelo WhatsApp
      const urlParams = new URLSearchParams(window.location.search);
      const name = urlParams.get('name') || '';
      const rawPhone = urlParams.get('phone') || '';

      let cleanPhone = rawPhone.replace(/\D/g, '');
      if (cleanPhone.length >= 10 && cleanPhone.length <= 11) {
        cleanPhone = '55' + cleanPhone;
      }

      // 2. Prepara o envio do webhook para a VPS
      const sendWebhook = fetch(`${RAPUNZEL_URL}/api/webhooks/funnels/${FUNNEL_ID}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: name,
          phone: cleanPhone || rawPhone,
          tag: "Clicou no Link do WhatsApp - Indo para Checkout"
        })
      });

      // 3. Trava de segurança: espera no máximo 1.2s para nunca travar a tela do cliente
      const minDelay = new Promise(resolve => setTimeout(resolve, 1200));

      try {
        await Promise.allSettled([sendWebhook, minDelay]);
      } catch (err) {
        console.warn("Webhook finalizado/ignorado:", err);
      }

      // 4. Monta o link da Wiapay passando os dados pré-preenchidos
      const separator = CHECKOUT_URL.includes('?') ? '&' : '?';
      let finalUrl = CHECKOUT_URL;

      if (cleanPhone || name) {
        finalUrl = `${CHECKOUT_URL}${separator}name=${encodeURIComponent(name)}&phone=${cleanPhone}&cellphone=${cleanPhone}&telephone=${cleanPhone}`;
      }

      // Redireciona na hora
      window.location.replace(finalUrl);
    }

    window.addEventListener('DOMContentLoaded', redirectNow);
  </script>
</body>
</html>
